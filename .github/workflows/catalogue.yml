name: Catalogue

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "catalog/apps/**"
      - "catalog/deals/**"
  push:
    branches: [main]
    paths:
      - "catalog/apps/**"
      - "catalog/deals/**"
      - "scripts/sync-catalogue-changes.mjs"
      - "scripts/lib/catalogue-sync-client.mjs"
      - "src/lib/catalogue/**"
      - "src/app/api/internal/catalogue-sync/**"
      - ".github/workflows/catalogue.yml"

# Keep reconciliation runs in order; do not interrupt a partially imported run.
concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check public catalogue contribution files
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'Beingpax' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changes < <(git diff --name-status "$BASE_SHA" "$HEAD_SHA")
          if [[ ${#changes[@]} -lt 1 || ${#changes[@]} -gt 2 ]]; then
            echo "Public pull requests may add one app, one deal, or one new app with its matching deal."
            printf '%s\n' "${changes[@]}"
            exit 1
          fi

          app_slug=""
          deal_slug=""
          for change in "${changes[@]}"; do
            IFS=$'\t' read -r status changed_path <<< "$change"
            if [[ "$status" != "A" || ! "$changed_path" =~ ^catalog/(apps|deals)/([a-z0-9]+(-[a-z0-9]+)*)\.json$ ]]; then
              echo "Public pull requests may only add new application or deal manifests. Open an issue for other changes."
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" == "apps" ]]; then
              app_slug="${BASH_REMATCH[2]}"
            else
              deal_slug="${BASH_REMATCH[2]}"
            fi
          done
          if [[ ${#changes[@]} -eq 2 && ( -z "$app_slug" || -z "$deal_slug" || "$app_slug" != "$deal_slug" ) ]]; then
            echo "A two-file submission must contain one new app and one new deal with the same slug."
            exit 1
          fi
      - run: node scripts/validate-catalogue.mjs

  sync:
    timeout-minutes: 30
    # Reconcile valid files even when a different manifest fails validation.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full branch history; the sync script fetches a missing previous
          # tip separately when a force push has rewritten that history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Create pending editorial revisions
        env:
          CATALOG_SYNC_SECRET: ${{ secrets.CATALOG_SYNC_SECRET }}
          CATALOG_SYNC_URL: ${{ secrets.CATALOG_SYNC_URL }}
          BASE_SHA: ${{ github.event.before || github.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: node scripts/sync-catalogue-changes.mjs "$BASE_SHA" "$COMMIT_SHA"
